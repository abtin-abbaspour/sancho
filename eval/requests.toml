# Matching eval: natural-language requests and the expected result.
#
# expect: a recipe id (a plan with these slot values is the right answer),
#         "clarify" (asking the user is the right answer), or
#         "unsupported" (no recipe should be offered; clarifying is also accepted).
# slots:  expected resolved keys (unit names, package names, vid:pid, desktop IDs).
# system: fixture under eval/fixtures/systems (default below).
#
# Run: cargo run -p sancho-eval -- eval/requests.toml

system = "eval_desktop"

