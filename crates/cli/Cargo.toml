[package]
name = "sancho"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sancho"
path = "src/main.rs"

[dependencies]
# clap: argument parsing and --help/--version.
clap = { version = "4.5", features = ["derive"] }
# libc: geteuid() for the root refusal; no std equivalent.
libc = "0.2"
# rustyline: line editing and in-memory history for sessions (no history file).
rustyline = { version = "19", default-features = false }
sancho-core.workspace = true
sancho-exec.workspace = true
sancho-explain.workspace = true
sancho-facts.workspace = true
sancho-journal.workspace = true
sancho-learn.workspace = true
sancho-match.workspace = true
sancho-plan.workspace = true
sancho-profile.workspace = true
sancho-resolve.workspace = true
