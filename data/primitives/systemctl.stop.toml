id = "systemctl.stop"
summary = "Stop a running systemd unit"
command = ["systemctl", "stop", "{unit}"]
package = "systemd"
needs_root = true
risk = "medium"
read_only = false
effects = [{ kind = "service_runtime", target = "{unit}" }]

[args]
unit = { type = "systemd_unit", help = "Unit to stop" }
