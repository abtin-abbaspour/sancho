id = "systemctl.start"
summary = "Start a systemd unit now"
command = ["systemctl", "start", "{unit}"]
package = "systemd"
needs_root = true
risk = "medium"
read_only = false
effects = [{ kind = "service_runtime", target = "{unit}" }]

[args]
unit = { type = "systemd_unit", help = "Unit to start" }
