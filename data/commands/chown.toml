command = "chown"
summary = "Changes the owner and group of files"
risk = "medium"

flags = [
  { names = ["-R", "--recursive"], help = "Also change everything inside directories", risk = "high" },
  { names = ["-v", "--verbose"], help = "Print each changed file" },
  { names = ["-h", "--no-dereference"], help = "Change symlinks themselves, not what they point to" },
]
